<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030805">
  <meta name="description" content="Seven questions. Twenty seconds. One computer to infect. A daily trivia game in green phosphor.">
  <title>Germillion — a daily infection</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/font.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#screen">Skip to game</a>
  <main class="terminal">
    <header><a class="wordmark" href="/" aria-label="Germillion home">GERMILLION</a><button class="sound" id="sound" aria-label="Enable sound" aria-pressed="false" title="Enable sound">SND OFF</button></header>
    <section class="memory" aria-label="Computer infection">
      <canvas id="memory" width="640" height="260" aria-hidden="true"></canvas>
      <p id="infection" class="infection">0% INFECTED</p>
    </section>
    <section id="screen" tabindex="-1"><p class="connecting">Connecting<span class="blink">_</span></p></section>
    <p id="error" role="alert" hidden></p>
    <footer id="footer"><button id="how">How to play</button><span aria-hidden="true">·</span><button id="practice">Unlimited</button><span aria-hidden="true">·</span><button id="archive">Archive</button></footer>
  </main>
  <dialog id="info"><form method="dialog"><button class="close" aria-label="Close dialog">×</button></form><div id="info-content"></div></dialog>
  <noscript>Germillion needs JavaScript to run the 20-second clock. Enable it and reload.</noscript>
</body>
</html>
